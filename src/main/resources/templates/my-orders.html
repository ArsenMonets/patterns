<!DOCTYPE html>
<html>
<head>
    <title>My Orders - Store Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #333; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin-left: 20px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; margin-bottom: 20px; }
        .success { color: #155724; background: #d4edda; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: bold; }
        .status-pending { color: #ffc107; font-weight: bold; }
        .status-confirmed { color: #28a745; font-weight: bold; }
        .btn-secondary { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        .btn-secondary:hover { background: #5a6268; }
    </style>
</head>
<body>
    <header>
        <h2>My Orders</h2>
        <nav>
            <a href="/shop">Shop</a>
            <a href="/my-orders">My Orders</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h1>Your Orders</h1>
        ${success ? '<div class="success">Order placed successfully!</div>' : ''}
        <table>
            <tr>
                <th>Order ID</th>
                <th>Status</th>
                <th>Products</th>
            </tr>
            #foreach(order in orders)
            <tr>
                <td>${order.id}</td>
                <td class="status-${order.status}">
                    #if(${order.status} == "PENDING")
                    <span class="status-pending">PENDING</span>
                    #else
                    <span class="status-confirmed">CONFIRMED</span>
                    #end
                </td>
                <td>${order.productCount} product(s)</td>
            </tr>
            #end
        </table>
        <br>
        <a href="/shop" class="btn-secondary">Continue Shopping</a>
    </div>
</body>
</html>
