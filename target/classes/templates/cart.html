<!DOCTYPE html>
<html>
<head>
    <title>Cart - Store Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #333; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin-left: 20px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; margin-bottom: 20px; }
        .error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: bold; }
        .total { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; margin-right: 10px; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
    </style>
</head>
<body>
    <header>
        <h2>Shopping Cart</h2>
        <nav>
            <a href="/shop">Shop</a>
            <a href="/my-orders">My Orders</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h1>Your Cart</h1>
        ${error ? '<div class="error">' + error + '</div>' : ''}
        <table>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
            </tr>
            #foreach(item in cart)
            <tr>
                <td>${item.name}</td>
                <td>$${item.price}</td>
            </tr>
            #end
        </table>
        <div class="total">Total: $${total}</div>
        <form method="post" action="/checkout">
            <button type="submit" class="btn btn-success">Checkout</button>
        </form>
        <a href="/shop" class="btn btn-secondary">Continue Shopping</a>
    </div>
</body>
</html>
