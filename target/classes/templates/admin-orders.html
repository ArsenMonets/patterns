<!DOCTYPE html>
<html>
<head>
    <title>Admin Orders - Store Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #333; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin-left: 20px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; margin-bottom: 20px; }
        .success { color: #155724; background: #d4edda; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: bold; }
        .status-pending { color: #ffc107; font-weight: bold; }
        .status-confirmed { color: #28a745; font-weight: bold; }
        .btn { display: inline-block; padding: 5px 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #218838; }
        .btn-nav { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; margin-right: 10px; }
        .btn-nav:hover { background: #5a6268; }
    </style>
</head>
<body>
    <header>
        <h2>Admin Panel - Orders</h2>
        <nav>
            <a href="/admin/orders">Orders</a>
            <a href="/admin/products">Products</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h1>Pending Orders</h1>
        ${success}
        <table>
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Products</th>
                <th>Action</th>
            </tr>
            #foreach(order in orders)
            <tr>
                <td>${order.id}</td>
                <td>${order.customerName}</td>
                <td>${order.status}</td>
                <td>${order.productCount} product(s)</td>
                <td>
                    <form method="post" action="/admin/confirm-order" style="display:inline">
                        <input type="hidden" name="order_id" value="${order.id}">
                        <button type="submit" class="btn">Confirm</button>
                    </form>
                </td>
            </tr>
            #end
        </table>
    </div>
</body>
</html>
