<!DOCTYPE html>
<html>
<head>
    <title>Store Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #333; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin-left: 20px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .hero { background: white; padding: 40px; border-radius: 8px; text-align: center; margin: 20px 0; }
        .hero h1 { color: #333; margin-bottom: 10px; }
        .hero p { color: #666; }
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; margin: 10px 5px; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
    </style>
</head>
<body>
    <header>
        <h2>Store Management System</h2>
        <nav>
            ${user ? '<a href="/shop">Shop</a><a href="/my-orders">My Orders</a><a href="/logout">Logout (' + user.username + ')</a>' : '<a href="/login">Login</a><a href="/register">Register</a>'}
        </nav>
    </header>
    <div class="container">
        <div class="hero">
            <h1>Welcome to Our Store</h1>
            ${user ? '<p>Hello, ' + user.username + '!</p>' : '<p>Please login or register to continue.</p>'}
            ${user ? '' : '<a href="/login" class="btn">Login</a><a href="/register" class="btn">Register</a>'}
        </div>
    </div>
</body>
</html>
